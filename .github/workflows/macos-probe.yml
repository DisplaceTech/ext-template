# Temporary diagnostic: minimal repro for the 2026-06-12 macOS setup-php
# failures across the extension repos. Dispatch manually; delete when
# upstream recovers.
name: macOS probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        setup: ['v2', '2.37.1', '2.36.0']
    steps:
      - uses: shivammathur/setup-php@${{ matrix.setup }}
        with:
          php-version: '8.4'
      - run: php -v
