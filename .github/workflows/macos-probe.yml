# Temporary diagnostic: minimal repro for the 2026-06-12 macOS setup-php
# failures across the extension repos. Dispatch manually; delete when
# upstream recovers.
name: macOS probe
on: workflow_dispatch
jobs:
  v2:
    runs-on: macos-14
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - run: php -v
  v2371:
    runs-on: macos-14
    steps:
      - uses: shivammathur/setup-php@2.37.1
        with: {php-version: '8.4'}
      - run: php -v
  # 2.37.2 claims the fix ("marking shivammathur/php and
  # shivammathur/extensions as trusted taps") — probe it on 8.4 and on
  # 8.5 (the leg the CI matrix currently excludes).
  v2372:
    runs-on: macos-14
    steps:
      - uses: shivammathur/setup-php@2.37.2
        with: {php-version: '8.4'}
      - run: php -v
  v2372_php85:
    runs-on: macos-14
    steps:
      - uses: shivammathur/setup-php@2.37.2
        with: {php-version: '8.5'}
      - run: php -v
  v2360:
    runs-on: macos-14
    steps:
      - uses: shivammathur/setup-php@2.36.0
        with: {php-version: '8.4'}
      - run: php -v
