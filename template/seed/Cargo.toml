[package]
name          = "ext-{{NAME}}"
version       = "0.0.0"
edition       = "2021"
rust-version  = "1.88"
license       = "MIT"
description   = "{{DESCRIPTION}}"
repository    = "https://github.com/DisplaceTech/ext-{{NAME}}"
readme        = "README.md"
publish       = false

[lib]
name       = "{{NAME}}"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.15.13"
thiserror  = "=2.0.18"
# Pin domain crates EXACTLY (=x.y.z) — upgrades are deliberate, tested bumps.

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[dev-dependencies]
tempfile = "=3.27.0"
