# Crates whose exact pins are bumped deliberately rather than by
# Dependabot. bin/upstream-check compares each pin against crates.io's
# latest stable release and opens (or updates) one ext-template issue per
# crate that has fallen behind; the issue closes itself once the pin
# catches up.
#
# <source> <crate>
#   source `versions.conf` reads the pin from template/versions.conf
#   (via the KEY named in the third column); `owner/repo` reads it from
#   that repo's Cargo.toml on its default branch.

versions.conf      ext-php-rs   EXT_PHP_RS_PIN
versions.conf      thiserror    THISERROR_PIN
DisplaceTech/ext-infer     llama-cpp-2
DisplaceTech/ext-turbovec  turbovec
DisplaceTech/ext-whisper   whisper-rs
