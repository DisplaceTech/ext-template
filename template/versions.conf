# Single source of truth for the toolchain and the dependency pins every
# extension shares. Bump here, run `bin/sync` against each extension, and
# the change cascades — rust-toolchain.toml is template-managed, and
# bin/sync patches these exact pins inside each child's (otherwise
# extension-owned) Cargo.toml.
#
# Unlike .ext-template.conf these values are global, not per-repo: the
# floor is set by the most demanding extension and everyone rides it.

# rustup channel (rust-toolchain.toml). 1.89 floor: turbovec's AVX-512BW
# kernel uses #[target_feature(enable = "avx512bw", ...)], stabilized in
# 1.89; infer/whisper are forward-compatible.
RUST_CHANNEL=1.89.0

# Declared MSRV (Cargo.toml `rust-version`); tracks RUST_CHANNEL's minor.
RUST_VERSION=1.89

# Shared crate pins — exact (=x.y.z), upgrades are deliberate tested bumps.
EXT_PHP_RS_PIN==0.15.13
THISERROR_PIN==2.0.18
